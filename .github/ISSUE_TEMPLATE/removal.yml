name: 削除のお願い / Removal request
description: サイトに出ている声を消してほしい時 / Ask us to remove a voice from the site
title: "削除のお願い / Removal: "
labels: ["removal"]
body:
  - type: markdown
    attributes:
      value: |
        voice-match に出ている声を、サイトと公開データ（名前・所属・大枠・公式ページ・声の数字）から消すためのお願いです。ご本人、または所属事務所・運営会社の方からのお願いを受け付けます。
        **ここに書いた内容は公開されます。** 公開したくない時は、[Google フォーム](https://docs.google.com/forms/d/e/1FAIpQLSeWtH6Ymeb1bNpSxf8iAe3JI5Qiq_AIDF3TuZgJM35KxaJoJg/viewform) か、メール（contact@voice-match.com）で送ってください。

        This asks us to remove a voice from voice-match and its public data (name, affiliation, category, official page and voice numbers). We accept requests from the person themselves, or from their agency or company.
        **What you write here is public.** To keep it private, use the [Google Form](https://docs.google.com/forms/d/e/1FAIpQLSeWtH6Ymeb1bNpSxf8iAe3JI5Qiq_AIDF3TuZgJM35KxaJoJg/viewform) or email contact@voice-match.com.
  - type: input
    id: name
    attributes:
      label: サイトに出ている名前 / Name shown on the site
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: あなたと、その人の関係 / Your relationship to that person
      options:
        - 本人 / Myself
        - 所属事務所・運営会社 / Agency or company
        - 代理人 / Representative
        - そのほか / Other
    validations:
      required: true
  - type: textarea
    id: confirm
    attributes:
      label: 確かめる方法（任意）/ How we can confirm (optional)
      description: 例: 公式 X のアカウントからも連絡できる など / e.g. you can also contact us from the official X account
  - type: textarea
    id: note
    attributes:
      label: ほかに伝えたいこと（任意）/ Anything else (optional)
