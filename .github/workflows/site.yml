# サイトのビルドと公開。main に push した時と、毎日 6:00（日本時間）に動く。
# 置き場所: Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID がある時は Cloudflare Pages（voice-match.com）、無い時は GitHub Pages。
# 公開の住所（OGP・共有カード・X の投稿に入る）は Variables の VITE_SITE_URL。無ければ src/site-config.ts の既定。
# 声の登録は Google スプレッドシートだけに置く（運営だけが見られる）。サイトを作る時に tools/intake.ts がシートを読み、
# 出すと決まった声だけを data/generated/ に作ってページに入れる。リポジトリには書き込まない（履歴に残さない）。
# シートを読めなかった時は、そこで止める（その日は公開せず、前のページのまま）。鍵は Secrets にだけ置く。
# 取り込みは dots の判定（毎日 5:00）が終わった後の時刻に動かす。
# 運営が測った声は、GitHub の Release「voices-data」の operator-voices.json から取ってくる（tools/voices-release.ts が置く。コミットしない）。
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TO_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    outputs:
      cloudflare: ${{ steps.where.outputs.cloudflare }}
    steps:
      - id: where
        run: echo "cloudflare=$TO_CLOUDFLARE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 声の登録を取り込む（スプレッドシートから。ログには件数だけ）
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_RANGE: ${{ vars.SHEET_RANGE }}
          BLOCK_RANGE: ${{ vars.BLOCK_RANGE }}
          NG_RANGE: ${{ vars.NG_RANGE }}
        run: node tools/intake.ts --sheet
      - name: 運営が測った声（Release「voices-data」から。無ければ入れない）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p data/generated
          tags=$(gh release list --limit 200 --json tagName -q '.[].tagName')
          if grep -qx voices-data <<< "$tags"; then
            gh release download voices-data --pattern operator-voices.json --dir data/generated --clobber
            node -e "const f=require('./data/generated/operator-voices.json'); console.log('運営が測った声: ' + f.voices.length + ' 人')"
          else
            echo 'Release voices-data が無いので、運営が測った声は入れません'
          fi
      - name: GitHub のスターの数（設定がある時だけ）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/github-stars.ts
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - name: Cloudflare Pages へ送る（鍵がある時だけ。プロジェクトが無ければ最初に作る）
        if: env.TO_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'voice-match' }}
        run: |
          npx --yes wrangler@4.151.3 pages project create "$PROJECT" --production-branch=main > /dev/null 2>&1 || true
          npx --yes wrangler@4.151.3 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
      - uses: actions/upload-pages-artifact@v3
        if: env.TO_CLOUDFLARE != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.cloudflare != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
